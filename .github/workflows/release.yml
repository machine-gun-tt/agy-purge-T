name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Test
        run: node --test

      - name: Pack
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          NAME="agy-purge-T-${VERSION}"
          mkdir -p dist
          git archive --format=zip --prefix="${NAME}/" -o "dist/${NAME}.zip" HEAD
          git archive --format=tar.gz --prefix="${NAME}/" -o "dist/${NAME}.tar.gz" HEAD
          sed "s/{{VERSION}}/v${VERSION}/g" .github/release-body.md > dist/RELEASE_NOTES.md
          ls -la dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/agy-purge-T-*
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: false
